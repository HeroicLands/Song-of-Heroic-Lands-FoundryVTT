# This repository builds and deploys the whole of /sohl/ as one standalone
# site (#1444, #1470): the package landing here at the root, the knowledgebase
# under kb/, and the generated API documentation under api/ (mounted into the
# build from `npm run docs:html`, not rendered by Hugo).
#
# The output is published *with* this prefix — `build/site/sohl/` — so the
# deployment is byte-for-byte what www serves and can be checked at the hosting
# project's own address before any routing points at it.
baseURL = "https://www.heroiclands.org/sohl/"
locale = "en-us"
title = "Song of Heroic Lands"
publishDir = "../build/site/sohl"

# Brand chrome, layouts, palette, and SoHL info-block partials come from the
# shared theme, so /sohl/ reads as one site with www and Thalorna.
#
# It arrives through `npm ci`, not a git submodule (#1640). Hugo looks for
# `<themesDir>/<theme>`, so the package's scope is the themes directory and its
# name is the theme name — nothing is copied and no module mounts are needed.
#
# `themesDir` is relative to the **Hugo root**, which is this directory, not the
# repository root; the lockfile that installed the theme is one level up.
themesDir = "../node_modules/@heroiclands"
theme = "hugo-theme"

[params]
  description = "Song of Heroic Lands — a classless, skill-based fantasy system for Foundry Virtual Tabletop."
  author = "Tom Rodriguez"

  # The theme carries layout, not addresses, so every site-specific URL it
  # renders is supplied here. See the theme's README for the full contract.
  # This site renders its own home page (layouts/index.html), so it needs no
  # params.home.
  cdnBaseURL = "https://cdn.heroiclands.org"

  [params.brand]
    logo       = "images/brand/sohl-icon-white.webp"
    licenseURL = "https://www.heroiclands.org/license/"
    discordURL = "https://discord.gg/EwMfkNd3az"

  # This is a reference catalog: a page's shortcode is the identifier the
  # system uses for that item, so listings show "Name (shortcode)". A
  # narrative site leaves this unset and gets plain titles.
  [params.list]
    shortcodes = true

  # The "page not found" page. Its template is the theme's, since every
  # consumer needs one; the wording and the routes back are ours. One page
  # covers the whole of /sohl/, so it names every surface — a reader who
  # mistyped an API address is served the same file as one who mistyped a
  # knowledgebase address. Each url is resolved against this site's own base by
  # the template, so it is written relative to the site root ("" being the root
  # itself) and picks up the /sohl/ prefix.
  [params.notfound]
    heroimage = "images/brand/sohl-banner.webp"
    tagline   = "Song of Heroic Lands has no page at"
    sitenoun  = "site"

    [[params.notfound.links]]
      title = "Song of Heroic Lands"
      url   = ""
      text  = "What the system is, and where everything about it lives."
    [[params.notfound.links]]
      title = "Knowledgebase"
      url   = "kb/"
      text  = "Every section, with the full content catalog."
    [[params.notfound.links]]
      title = "API Documentation"
      url   = "api/"
      text  = "Generated reference for the current release."
    [[params.notfound.links]]
      title = "Developer Documentation"
      url   = "kb/dev-docs/"
      text  = "Architecture, extension points, testing, and reference material."
    [[params.notfound.links]]
      title = "User Guide"
      url   = "kb/user-guide/"
      text  = "Player- and GM-facing guides to playing with Song of Heroic Lands."
    [[params.notfound.links]]
      title = "Rules"
      url   = "kb/rules/"
      text  = "Success and opposed tests, injury, healing, shock, bleeding, and trauma."

# The brand nav. Absolute URLs so this header matches the one every other
# site renders; defined here rather than in the shared theme, which carries
# no addresses of its own.
[menu]
  [[menu.main]]
    name = "Home"
    url = "https://www.heroiclands.org/"
    weight = 1
  [[menu.main]]
    name = "Song of Heroic Lands"
    url = "https://www.heroiclands.org/projects/song-of-heroic-lands/"
    weight = 2
    identifier = "sohl"
  [[menu.main]]
    name = "Knowledgebase"
    url = "https://www.heroiclands.org/sohl/kb/"
    weight = 1
    parent = "sohl"
  [[menu.main]]
    name = "API Documentation"
    url = "https://www.heroiclands.org/sohl/api/"
    weight = 2
    parent = "sohl"
  [[menu.main]]
    name = "Thalorna"
    url = "https://www.heroiclands.org/thalorna/world/thalorna/"
    weight = 3
  [[menu.main]]
    name = "HârnMaster 3"
    url = "https://www.heroiclands.org/projects/hm3/"
    weight = 4
  [[menu.main]]
    name = "Modules"
    url = "https://www.heroiclands.org/projects/modules/"
    weight = 5
  [[menu.main]]
    name = "License"
    url = "https://www.heroiclands.org/license/"
    weight = 6

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

# content/ is generated from the repo's assets/content/ + kb/dev-docs/ by
# `utils/build-kb-content.mjs` (a build step; not committed).
