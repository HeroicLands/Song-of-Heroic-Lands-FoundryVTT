# Dependabot version updates.
#
# Labels are pinned to `devops` deliberately. Dependabot's own default label is
# `dependencies`, which is not in `.github/labels.yml` — and that registry is a
# closed set, so `labels-sync.yml` would delete the label again on the next push
# to `main`. Naming a managed label keeps the two from fighting.
#
# Only minor and patch bumps are grouped. A major bump is a decision, not
# housekeeping, so it arrives as its own pull request with its own changelog to
# read.
version: 2
updates:
    - package-ecosystem: npm
      # The root lockfile covers every workspace (`packages/*` and `.`), so one
      # entry here updates the whole monorepo.
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - devops
      commit-message:
          prefix: chore(deps)
          prefix-development: chore(deps-dev)
      groups:
          production-minor-patch:
              dependency-type: production
              update-types:
                  - minor
                  - patch
          development-minor-patch:
              dependency-type: development
              update-types:
                  - minor
                  - patch

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - devops
      commit-message:
          prefix: chore(ci)
      groups:
          github-actions:
              patterns:
                  - "*"
