name: Publish dist Branch

# Publishes this repository's built web surfaces to the `dist` branch, which
# heroiclands-site checks out and mounts as `/sohl/kb/` and `/sohl/api/` (#1444).
#
#   dist/kb-content/   knowledgebase markdown, built from main
#   dist/api/          TypeDoc HTML, built from the newest release tag
#
# The two halves are independent and refresh on their own cadence, so every
# publish rewrites only the half it built and carries the other half forward
# from the branch's current tip.
#
# Markdown, not rendered HTML: the site owns the layouts and runs Hugo, so
# nothing here needs Hugo or the shared-theme submodule.
#
# This workflow deploys nothing. deploy-sohl.yml owns the live site; this is
# purely additive and publishes build output. Retiring it is #1467.

on:
    # The knowledgebase half tracks main. The path filter mirrors deploy-kb.yml's
    # (widened to the utils tree, since a builder change can alter every page):
    # republishing more often than strictly needed costs one no-op run, while
    # republishing too rarely serves stale content.
    push:
        branches: [main]
        paths:
            - "kb/**"
            - "assets/content/**"
            - "assets/manifests/**"
            - "utils/**"
            - ".github/workflows/deploy-dist.yml"
    # The API half tracks the newest release. As in deploy-sohl.yml, a Release
    # created with GITHUB_TOKEN cannot fire a `release:` event, so the release
    # workflow's completion is the seam. Nothing is passed between the two — the
    # newest release tag is resolved here — so a run that released nothing
    # rebuilds the same tag and finds no diff to push.
    workflow_run:
        workflows: ["Version and Release"]
        types: [completed]
    workflow_dispatch:
        inputs:
            surfaces:
                description: Which surfaces to rebuild
                type: choice
                options:
                    - both
                    - kb-content
                    - api
                default: both

permissions:
    contents: read

jobs:
    # Which halves this run publishes, and (for the API half) from which tag.
    plan:
        name: Plan
        # Skip when the release workflow failed or was cancelled.
        if: >-
            github.event_name != 'workflow_run' ||
            github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        outputs:
            kb: ${{ steps.plan.outputs.kb }}
            api: ${{ steps.plan.outputs.api }}
            tag: ${{ steps.plan.outputs.tag }}
        steps:
            - name: Decide which surfaces to publish
              id: plan
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  EVENT: ${{ github.event_name }}
                  CHOICE: ${{ inputs.surfaces }}
              run: |
                  set -euo pipefail
                  case "${EVENT}" in
                      push)        KB=true;  API=false ;;
                      workflow_run) KB=false; API=true  ;;
                      workflow_dispatch)
                          case "${CHOICE}" in
                              kb-content) KB=true;  API=false ;;
                              api)        KB=false; API=true  ;;
                              *)          KB=true;  API=true  ;;
                          esac ;;
                      *) echo "Unhandled event ${EVENT}." >&2; exit 1 ;;
                  esac

                  TAG=""
                  if [ "${API}" = "true" ]; then
                      # `|| true`: a repository with no release answers 404, and
                      # the empty-tag branch below reports that far more clearly
                      # than gh's exit status would under `set -e`.
                      TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
                      if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
                          # Not fatal: the knowledgebase half must still publish.
                          echo "::notice::No published release found — skipping the API documentation."
                          API=false
                          TAG=""
                      fi
                  fi

                  # The release workflow completes on *every* push to main, not
                  # only on the ones that release something, so this trigger
                  # mostly fires for a tag that is already published. The API
                  # half is a pure function of its tag — it is built from the
                  # tag's own tree and lockfile — so a rebuild would be
                  # byte-identical, and the whole TypeDoc build is skippable.
                  # Only on this trigger: a manual dispatch always rebuilds,
                  # which is the escape hatch when a publish went wrong.
                  if [ "${API}" = "true" ] && [ "${EVENT}" = "workflow_run" ]; then
                      PUBLISHED=$(gh api \
                          -H "Accept: application/vnd.github.raw" \
                          "repos/${GITHUB_REPOSITORY}/contents/metadata.json?ref=dist" \
                          2>/dev/null | jq -r '.surfaces.api.source // ""' 2>/dev/null || true)
                      if [ -n "${PUBLISHED}" ] && [ "${PUBLISHED}" = "${TAG}" ]; then
                          echo "::notice::${TAG} is already published to dist — skipping the API documentation."
                          API=false
                      fi
                  fi

                  echo "Publishing — knowledgebase: ${KB}, API: ${API} ${TAG:+(${TAG})}"
                  {
                      echo "kb=${KB}"
                      echo "api=${API}"
                      echo "tag=${TAG}"
                  } >> "$GITHUB_OUTPUT"

    kb:
        name: Build knowledgebase content
        needs: plan
        if: needs.plan.outputs.kb == 'true'
        runs-on: ubuntu-latest
        outputs:
            commit: ${{ steps.source.outputs.commit }}
        steps:
            # Always main, never the triggering ref: the knowledgebase half is
            # defined as "the current state of main", and the sha recorded in the
            # published metadata is read back from the checkout so it names what
            # was actually built.
            - name: Checkout main
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Record the source commit
              id: source
              run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Markdown only — no Hugo, no theme submodule.
            - name: Build knowledgebase content
              run: npm run build:kb-content

            # An empty tree would publish as a wholesale deletion, so fail here
            # instead of pushing one.
            - name: Verify content was generated
              run: |
                  set -euo pipefail
                  COUNT=$(find kb/content -type f -name '*.md' | wc -l)
                  echo "Generated ${COUNT} markdown file(s)."
                  test "${COUNT}" -gt 0

            - name: Upload the knowledgebase content
              uses: actions/upload-artifact@v4
              with:
                  name: dist-kb-content
                  path: kb/content
                  retention-days: 1
                  if-no-files-found: error

    api:
        name: Build API documentation
        needs: plan
        if: needs.plan.outputs.api == 'true'
        runs-on: ubuntu-latest
        outputs:
            commit: ${{ steps.source.outputs.commit }}
        steps:
            - name: Checkout the release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.plan.outputs.tag }}

            - name: Record the source commit
              id: source
              run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build API documentation
              run: |
                  npm run docs:prepare
                  npm run docs:html

            - name: Verify documentation was generated
              run: test -s build/docs-html/index.html

            - name: Upload the API documentation
              uses: actions/upload-artifact@v4
              with:
                  name: dist-api
                  path: build/docs-html
                  retention-days: 1
                  if-no-files-found: error

    publish:
        name: Publish to dist
        needs: [plan, kb, api]
        # Publish whatever built. A half that was skipped is carried forward from
        # the branch; a half that failed must not be published as a partial tree.
        if: >-
            always()
            && needs.plan.result == 'success'
            && !contains(needs.*.result, 'failure')
            && !contains(needs.*.result, 'cancelled')
            && (needs.kb.result == 'success' || needs.api.result == 'success')
        runs-on: ubuntu-latest
        # contents: write -> force-push the dist branch
        permissions:
            contents: write
        # Serialize publishes: every run rewrites the whole branch from its
        # current tip, so two of them must never overlap. Job-level, so the
        # builds above still run concurrently across runs.
        concurrency:
            group: dist-publish
            cancel-in-progress: false
        steps:
            - name: Download the knowledgebase content
              if: needs.kb.result == 'success'
              uses: actions/download-artifact@v4
              with:
                  name: dist-kb-content
                  path: staging/kb-content

            - name: Download the API documentation
              if: needs.api.result == 'success'
              uses: actions/download-artifact@v4
              with:
                  name: dist-api
                  path: staging/api

            - name: Publish to the dist branch
              id: publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  KB_BUILT: ${{ needs.kb.result == 'success' }}
                  KB_COMMIT: ${{ needs.kb.outputs.commit }}
                  API_BUILT: ${{ needs.api.result == 'success' }}
                  API_COMMIT: ${{ needs.api.outputs.commit }}
                  API_TAG: ${{ needs.plan.outputs.tag }}
              run: |
                  set -euo pipefail
                  REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  # Clone the current dist tip — that is where a half this run did
                  # not build is carried forward from — or seed a fresh orphan.
                  if git clone --depth 1 --branch dist "${REPO_URL}" dist 2>/dev/null; then
                      cd dist
                  else
                      echo "No dist branch yet; seeding one."
                      mkdir dist && cd dist
                      git init -q
                      git remote add origin "${REPO_URL}"
                      git checkout -q --orphan dist
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  SUMMARY=""
                  if [ "${KB_BUILT}" = "true" ]; then
                      rm -rf kb-content
                      cp -R "${GITHUB_WORKSPACE}/staging/kb-content" kb-content
                      SUMMARY="knowledgebase from main@${KB_COMMIT:0:7}"
                  fi
                  if [ "${API_BUILT}" = "true" ]; then
                      rm -rf api
                      cp -R "${GITHUB_WORKSPACE}/staging/api" api
                      SUMMARY="${SUMMARY:+${SUMMARY}, }API from ${API_TAG}"
                  fi

                  # Provenance, so a consumer (and a bisect) can tell what each
                  # half was built from. Deliberately carries no timestamp: an
                  # unchanged surface must produce an unchanged file, or the
                  # "nothing to publish" case below could never be reached.
                  [ -f metadata.json ] || echo '{}' > metadata.json
                  record() {
                      jq --arg surface "$1" --arg source "$2" --arg commit "$3" \
                          '.version = 1
                           | .repository = env.GITHUB_REPOSITORY
                           | .surfaces[$surface] = { source: $source, commit: $commit }' \
                          metadata.json > metadata.json.new
                      mv metadata.json.new metadata.json
                  }
                  if [ "${KB_BUILT}" = "true" ]; then
                      record kb-content main "${KB_COMMIT}"
                  fi
                  if [ "${API_BUILT}" = "true" ]; then
                      record api "${API_TAG}" "${API_COMMIT}"
                  fi

                  # The branch explains itself: it is checked out by people and
                  # by heroiclands-site, and neither should have to find this
                  # workflow to learn what they are looking at.
                  cat > README.md <<'EOF'
                  # `dist` — generated publishing branch

                  Build output from
                  [Song-of-Heroic-Lands-FoundryVTT](https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT),
                  published for `heroiclands-site` to assemble into
                  `www.heroiclands.org/sohl/`.

                  | Path          | Contents                            | Built from        |
                  | ------------- | ----------------------------------- | ----------------- |
                  | `kb-content/` | Knowledgebase markdown (Hugo pages) | `main`            |
                  | `api/`        | TypeDoc HTML for the API reference  | the newest release |

                  `metadata.json` records the source commit of each half.

                  **Nothing here is source, and nothing here is reviewed.** The branch is
                  written only by `.github/workflows/deploy-dist.yml`, which force-pushes a
                  single orphan commit each publish — so it has no history, and a pull
                  request against it would be overwritten by the next run. Change the
                  generators on `main` instead.

                  Consume it with an ordinary shallow checkout; no credentials beyond
                  repository read are needed:

                  ```bash
                  git clone --depth 1 --branch dist \
                      https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT.git
                  ```
                  EOF

                  git add -A
                  if git rev-parse --verify -q HEAD >/dev/null && git diff --cached --quiet; then
                      echo "No changes to publish."
                      echo "pushed=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  # A single-commit orphan branch each publish: dist carries build
                  # output, and its history would otherwise accrete a full copy of
                  # the API documentation per release forever. Unchanged files
                  # still dedupe to the same blobs, so the push stays small.
                  git checkout -q --orphan publish
                  git add -A
                  git commit -q -m "dist: ${SUMMARY}"
                  git push -q --force "${REPO_URL}" publish:dist
                  echo "pushed=true" >> "$GITHUB_OUTPUT"

            # heroiclands-site rebuilds from the dist branches (#1453). The token
            # is a PAT with `contents: write` on that repository; without it the
            # publish still succeeds and the site picks the change up on its next
            # build, so an unset secret is a skip, not a failure.
            - name: Trigger a site rebuild
              if: steps.publish.outputs.pushed == 'true'
              env:
                  SITE_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
                  KB_BUILT: ${{ needs.kb.result == 'success' }}
                  API_BUILT: ${{ needs.api.result == 'success' }}
                  API_TAG: ${{ needs.plan.outputs.tag }}
              run: |
                  set -euo pipefail
                  if [ -z "${SITE_TOKEN}" ]; then
                      echo "SITE_DISPATCH_TOKEN not configured; skipping the site rebuild."
                      exit 0
                  fi
                  PAYLOAD=$(jq -nc \
                      --arg repo "${GITHUB_REPOSITORY}" \
                      --argjson kb "${KB_BUILT}" \
                      --argjson api "${API_BUILT}" \
                      --arg tag "${API_TAG}" \
                      '{ event_type: "dist-updated",
                         client_payload: {
                             repository: $repo,
                             package: "sohl",
                             surfaces: ((if $kb then ["kb-content"] else [] end)
                                      + (if $api then ["api"] else [] end)),
                             release: $tag } }')
                  curl -fsS -X POST \
                      -H "Authorization: Bearer ${SITE_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      "https://api.github.com/repos/HeroicLands/heroiclands-site/dispatches" \
                      -d "${PAYLOAD}"
                  echo "Dispatched a rebuild to heroiclands-site."
