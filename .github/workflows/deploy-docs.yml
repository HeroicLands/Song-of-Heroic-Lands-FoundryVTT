name: Deploy API Docs to GitHub Pages

# Publishes ONE unversioned copy of the API documentation — the newest release —
# to the root of the gh-pages branch. There is no archive: git tags are the
# history, and any older version is reproducible from its tag.
on:
    # Fires after "Version and Release" finishes. That workflow creates its
    # Release with GITHUB_TOKEN, which by design cannot trigger a `release:`
    # event, so we key off the run instead. Nothing is passed between the two —
    # this job resolves the newest release tag itself — so a run that released
    # nothing simply rebuilds the same tag and finds no diff to push.
    workflow_run:
        workflows: ["Version and Release"]
        types: [completed]
    # Manual re-publish (e.g. after fixing a docs build). The selected ref is
    # irrelevant: the newest release tag is always what gets built.
    workflow_dispatch:

# contents: write -> push the built docs onto the gh-pages branch
permissions:
    contents: write

# Serialize publishes so runs never race on the gh-pages branch
concurrency:
    group: gh-pages-deploy
    cancel-in-progress: false

jobs:
    deploy:
        # Skip when the release workflow failed or was cancelled
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Resolve the newest release tag
              id: release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  # `|| true`: a repository with no release answers 404, and the
                  # empty-tag branch below reports that far more clearly than gh's
                  # exit status would under `set -e`.
                  TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
                  if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
                      echo "No published release found — there is nothing to document."
                      exit 1
                  fi
                  echo "Building API documentation from ${TAG}."
                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

            - name: Checkout the release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.release.outputs.tag }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build API documentation
              run: |
                  npm run docs:prepare
                  npm run docs:html

            - name: Publish to gh-pages
              id: publish
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.release.outputs.tag }}
              run: |
                  set -euo pipefail
                  REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  # Clone the existing gh-pages branch, or seed a fresh orphan if absent
                  if git clone --depth 1 --branch gh-pages "${REPO_URL}" gh-pages 2>/dev/null; then
                      cd gh-pages
                  else
                      mkdir gh-pages && cd gh-pages
                      git init -q
                      git remote add origin "${REPO_URL}"
                      git checkout -q --orphan gh-pages
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  # Replace the whole tree with this build. CNAME is preserved
                  # rather than written: GitHub Pages maintains it from the
                  # custom-domain setting, and deleting it would unset the domain.
                  find . -mindepth 1 -maxdepth 1 \
                      ! -name .git ! -name CNAME -exec rm -rf {} +
                  cp -R "${GITHUB_WORKSPACE}/build/docs-html/." .
                  touch .nojekyll

                  git add -A
                  if git diff --cached --quiet; then
                      echo "No documentation changes to publish."
                      echo "pushed=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  git commit -q -m "docs: publish ${TAG}"
                  git push -q origin gh-pages
                  echo "pushed=true" >> "$GITHUB_OUTPUT"

            - name: Purge Cloudflare cache
              # Only after an actual publish; skips cleanly if secrets are unset
              if: steps.publish.outputs.pushed == 'true'
              env:
                  CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
                  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
              run: |
                  set -euo pipefail
                  if [ -z "${CF_ZONE_ID}" ] || [ -z "${CF_API_TOKEN}" ]; then
                      echo "Cloudflare secrets not configured; skipping cache purge."
                      exit 0
                  fi
                  echo "Purging Cloudflare cache for zone ${CF_ZONE_ID}…"
                  resp=$(curl -fsS -X POST \
                      "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
                      -H "Authorization: Bearer ${CF_API_TOKEN}" \
                      -H "Content-Type: application/json" \
                      --data '{"purge_everything":true}')
                  echo "${resp}"
                  # Cloudflare returns HTTP 200 with success:false on logical errors
                  echo "${resp}" | grep -q '"success":true' || { echo "Cloudflare purge failed."; exit 1; }
