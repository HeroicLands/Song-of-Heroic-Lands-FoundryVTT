name: Version and Release

# The whole release process, from a merged pull request to a downloadable
# system. Nothing here is started by hand.
#
#   1. A pull request declares its bump as a `.changeset/*.md` file.
#   2. Merging it to `main` opens or updates the **Version Packages** pull
#      request: the version bump plus the rewritten CHANGELOG.md.
#   3. Merging *that* leaves no changesets, which is the signal to build the
#      system, package it, and cut the `v<version>` tag and the GitHub Release
#      that Foundry installs from.
#
# The steps live in HeroicLands/.github, not here. Six repositories carried
# near-identical copies of them, and one dependency bump broke several at once:
# `changesets/action` renamed every multi-word output at v2, a stale v1 name
# resolves to the empty string, and the release step was skipped forever while
# the job reported green (HeroicLands/.github#12). This is the sixth and last
# adoption, taken after the other five so that the caller with the most to lose
# went last.

on:
    push:
        branches: [main]
    # Manual recovery: re-runs the decision for a version that is merged and
    # versioned but never got its release. An existing tag is skipped rather
    # than duplicated, so running this is safe.
    workflow_dispatch:

# Declared here rather than in the shared workflow: a called workflow cannot
# grant itself more than its caller holds, so a fixed block there would have
# capped every caller at the narrowest set — and this caller is the reason,
# being the only one that needs more than the first two.
permissions:
    contents: write # push the version branch, create the tag and Release
    pull-requests: write # open and update the Version Packages pull request
    actions: write # dispatch deploy-sohl.yml from release:post

jobs:
    release:
        uses: HeroicLands/.github/.github/workflows/release-foundry-package.yml@main
        with:
            package-kind: system
            # The one thing only this repository does, after the Release
            # exists: republish /sohl/ from the new tag. See
            # utils/release-post.mjs — the shared workflow runs the script and
            # knows nothing about its contents.
            post-release-script: release:post
