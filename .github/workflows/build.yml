name: Build and Test (non-main)

on:
    push:
        branches-ignore:
            - main
            - gh-pages
    # NOTE: for `pull_request`, `branches`/`branches-ignore` filter on the PR's
    # BASE branch, not its head. Ignoring `main` here therefore excluded every
    # PR (they all target `main`), so this workflow only ever ran from `push`
    # and a PR showed a check only when a push run happened to share its SHA.
    pull_request:
        branches:
            - main

# A branch push and the PR opened from it both trigger this workflow. Key the
# group on the head branch (identical for either event) so the redundant run is
# cancelled instead of building the same commit twice.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
    cancel-in-progress: true

jobs:
    test-build:
        name: Build & Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check TODO issue links
              run: npm run lint:todos

            - name: Type-check project declaration files (skipLibCheck off)
              run: npm run lint:dts

            - name: Run tests with coverage
              run: npm run test:coverage

            - name: Upload coverage reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/

            - name: Build system
              run: npm run build

            - name: Build API documentation
              run: npm run docs:prepare && npm run docs:html

            - name: Upload API Documentation
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: api-docs
                  path: build/docs-html/
