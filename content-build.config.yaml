# This repository's content-build configuration — everything about the pack
# pipeline that is *this* repository's rather than any consumer's (#1508).
#
# Every value the pack compilers used to carry as a module-level constant is
# declared here: which content package they select, which Foundry package ships
# the result, where the content tree and the build outputs live, what each
# compiled document's `_stats` block says, and which packs exist. A different
# repository — `sohl-thalorna`, `sohl-kethira-basic`, an adventure module —
# ships the same toolchain with its own copy of this file and nothing else.
#
# **This file is the source; the manifest is generated from it.** That arrow
# used to point the other way: `system.template.json` was hand-authored JSON
# holding the pack list, the Foundry range and the package id a second time,
# and the build read `compatibility.minimum` back out of it. The template is
# retired (package-build#9) and nothing reads it any more.
#
# **What is absent is derived, not forgotten.** `rootDir` is the directory this
# file sits in; `foundryPackage` is the `name` of the `package.json` beside it;
# `stats.systemVersion` is that file's `version` — the one Changesets bumps —
# so the stamp equals the version of the system that compiled the document. A
# transcribed one froze at `0.6.0` for four releases (#1548). Authoring any of
# them is an error, not an override.

# The distribution unit a note declares in its `package:` frontmatter. The pack
# compilers select their entries by it, and it is stable across compilation
# targets.
contentPackage: sohl

# The Foundry package the packs ship in — the `id` in
# `assets/templates/system.template.json`, and the first segment of every
# compendium UUID the compilers emit. Equal to `contentPackage` here only by
# coincidence: in `sohl-thalorna` the two differ (#1498).
packageKind: systems

# Stamped into every compiled document's `_stats`. `systemId` names the game
# system the content is *for*, which a module shipping SoHL content still
# declares as "sohl". `coreVersion` is deliberately absent — it is read from the
# manifest's `compatibility.minimum` — and so is `systemVersion`, read from
# `package.json`.
stats:
    systemId: sohl
    lastModifiedBy: sohlbuilder00000

# The Foundry core range this system supports. `minimum` is stamped into every
# compiled document as `_stats.coreVersion`, so a document never claims to
# predate the migrations that would rewrite it. `verified` names the newest
# build the full suite has actually passed on — never an aspiration.
#
# It lives here rather than in the shipped manifest because the manifest is
# generated *from* this file now; reading it back would be a round trip through
# an artifact `build:db` can run before writing.
compatibility:
    minimum: "14.359"
    verified: "14.364"

# How this repository frames the pages `content-build docs` generates. The
# tables come from the `itemBuilders` registry and are the same wherever they
# are rendered; the heading, where the page is filed, and what a reader is told
# before the tables start are this repository's. They were the whole reason a
# script wrapped the renderer here.
docs:
    itemFields:
        title: Item Note Frontmatter
        out: kb/dev-docs/content-creator/item-frontmatter.md
        preamble:
            - "See also: [The Authoring Workflow](authoring-workflow.md), [Actor Notes](actor-notes.md), [Asset Conventions](asset-conventions.md)"
            - ""
            - "Every item note carries the frontmatter envelope described in [The Authoring Workflow](authoring-workflow.md) — `name.full`, `type`, `shortcode`, `package`, `id`, and the required `sohl.archetype`. This page covers what each **type** adds to that: the fields under its `sohl:` block, and nothing else."
            - ""
            - "The tables are rendered from the declaration that _builds_ each document, not from a description of it, so a field listed here is a field the compiler reads and a field absent here is one it ignores. An unrecognised `sohl:` key is silently dropped, so a typo shows up as a missing value rather than an error — check the spelling here first."

# Which content types compile into Items, and what builds each one's `system`
# block. `itemTypes` and the doc-carrying-type set are derived from the
# registry's keys, so a type cannot be accepted without a builder behind it
# (#1504). It is named rather than supplied: the registry is SoHL data-model
# knowledge living in the toolchain's `sohl` half, and data cannot carry code.
itemBuilders: sohl

# `assets/content/` is opened as an Obsidian vault, whose templater scaffolding
# lives in `Templates/` and is never compendium content.
skipDirectories: [Templates]

# The one pack list. Order is load-bearing: the actors pass resolves each
# being's embedded items against the items pass's output, so items compile
# first. `packDirectories` — what `build:compiledb` turns into LevelDB — is
# derived from this, so the compile list and the compiler list cannot drift
# apart the way `SOURCE_PACKS` and `PACK_CONFIGS` did.
packs:
    - { name: items, label: Items, type: Item, folders: item-folders.yaml }
    - {
          name: journals,
          label: Journals,
          type: JournalEntry,
          folders: journal-folders.yaml,
      }
    - { name: actors, label: Actors, type: Actor, folders: actor-folders.yaml }
    - { name: macros, label: Macros, type: Macro, folders: macro-folders.yaml }
    - name: scenes
      type: Scene
      label: Maps
      folders: scene-folders.yaml
      # One pass, two packs: every map note's Scene, and the Adventure bundling
      # the pinned ones with their journals so a `keepId: true` import makes the
      # pins resolve (#1525).
      companions:
          - { name: adventures, type: Adventure, label: Adventures }

# Everything `@heroiclands/package-build` needs. It reads this same file rather
# than one of its own: `packageKind` and `foundryPackage` above are two of the
# values it wants, and restating them in a second file is two places for one
# fact — which is exactly what `utils/push-stage.mjs` did before it was deleted.
packageBuild:
    # Staged into `build/stage` (the default), so each `to:` is the path *within*
    # the shipped package. The table each consumer used to keep locally spelled
    # `build/stage/` on every row.
    assets:
        - { from: assets/audio, to: assets/audio }
        - { from: assets/icons, to: assets/icons }
        - { from: assets/silhouette, to: assets/silhouette }
        - { from: assets/fonts, to: assets/fonts }
        - { from: assets/ui, to: assets/ui }
        - { from: lang, to: lang }
        - { from: templates, to: templates }
        - { from: LICENSE.md, to: LICENSE.md }
        - { from: README.md, to: README.md }

    # The one genuine piece of code in staging, and it stays this repository's:
    # every icon's hard-coded fill is rewritten to `currentColor` so the art
    # follows the Foundry theme. `cypress/e2e/icon-color-scheme.cy.js` is what
    # proves it reaches the browser.
    assetTransform: ./utils/svg-theme.mjs

    lang:
        sources: lang/*.json
        # A dotted-prefix collision makes `foundry.utils.expandObject` throw, and
        # Foundry then drops the whole translation file (#636).
        help: >-
            A dotted-prefix collision makes foundry.utils.expandObject throw, and
            Foundry then drops the whole translation file (issue #636). Make each
            key a leaf OR a branch, never both. See
            kb/dev-docs/reference/localization-keys.md for the placeholder and
            key-segment rules.

    # Vite emits `sohl.js`, not the `<packageId>.mjs` the toolchain assumes, so
    # the one thing `package-build bundle check` cannot derive is stated here.
    # It is deliberately not read back out of the generated manifest: a value
    # taken from there would agree with itself by construction, and the check's
    # whole question is whether the manifest declares this file the way Foundry
    # needs it.
    bundle:
        entry: sohl.js

    # `flags.sohl.creditsUuid` is not a literal: it is the compendium address of
    # the credits journal, which only exists once the content tree has been
    # walked. This module computes it.
    manifestFlags: ./utils/manifest-flags.mjs

    # The Foundry package manifest, generated into the build stage by
    # `package-build manifest`. Emitted as declared — `id`, `version`, the four
    # release addresses, `compatibility` and `packs` are derived and must not
    # appear here.
    #
    # Moved verbatim out of the retired `assets/templates/system.template.json`.
    manifest:
        title: Song of Heroic Lands
        description:
            "<p><strong>Song of Heroic Lands: A Gateway to Adventure!</strong> Embark on a journey
            through a richly detailed fantasy world with Song of Heroic Lands (SoHL)—a game system built to
            bring your adventures to life in Foundry Virtual Tabletop. Seamlessly compatible with the renowned
            HârnMaster system, SoHL allows you to experience the intricacies of one of the most immersive
            and realistic fantasy role-playing systems ever created.</p><p>Designed for both seasoned veterans
            and new players, SoHL captures the essence of detailed game mechanics while leveraging the power
            of Foundry VTT to streamline gameplay, enhance storytelling, and immerse you in the lore-rich
            environment.</p>"
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE.md
        readme: README.md
        changelog: CHANGELOG.md
        flags:
            allowBugReporter: true
            needsMigrationVersion: 0.3.5
            compatibleMigrationVersion: 0.3.0
        esmodules:
            - sohl.js
        styles:
            - css/sohl.css
        languages:
            - lang: en
              name: English
              path: lang/en.json
        documentTypes:
            Actor:
                being:
                    htmlFields:
                        - dossier
                        - appearance
                cohort:
                    htmlFields:
                        - dossier
                        - appearance
                structure:
                    htmlFields:
                        - dossier
                        - appearance
                vehicle:
                    htmlFields:
                        - dossier
                        - appearance
            Item:
                affiliation:
                    htmlFields:
                        - notes
                        - docHtml
                affliction:
                    htmlFields:
                        - notes
                        - docHtml
                armorgear:
                    htmlFields:
                        - notes
                        - docHtml
                attribute:
                    htmlFields:
                        - notes
                        - docHtml
                concoctiongear:
                    htmlFields:
                        - notes
                        - docHtml
                containergear:
                    htmlFields:
                        - notes
                        - docHtml
                trauma:
                    htmlFields:
                        - notes
                        - docHtml
                miscgear:
                    htmlFields:
                        - notes
                        - docHtml
                mystery:
                    htmlFields:
                        - notes
                        - docHtml
                mysticalability:
                    htmlFields:
                        - notes
                        - docHtml
                projectilegear:
                    htmlFields:
                        - notes
                        - docHtml
                skill:
                    htmlFields:
                        - notes
                        - docHtml
                weapongear:
                    htmlFields:
                        - notes
                        - docHtml
            ActiveEffect:
                sohleffectdata: {}
            RegionBehavior:
                trigger: {}
        packFolders:
            - name: Song of Heroic Lands
              sorting: m
              color: "#094fcb"
              packs:
                  - items
                  - journals
                  - actors
                  - macros
                  - scenes
                  - adventures
        media:
            - type: setup
              url: systems/sohl/assets/ui/sohl-icon-3d-1920x1080.webp
              thumbnail: systems/sohl/assets/ui/sohl-icon-3d-400x225.webp
            - type: logo
              url: systems/sohl/assets/ui/sohl-icon-3d-400x100.webp
            - type: icon
              url: systems/sohl/assets/ui/sohl-icon-3d-512x512.webp
            - type: banner
              url: systems/sohl/assets/ui/sohl-icon-3d-1200x400.webp
        socket: true
        grid:
            distance: 5
            units: ft
        primaryTokenAttribute: health

# This repository publishes a knowledgebase and a link manifest, and consumes
# the manifests of the packages it links into (#1385/#1446).
publish:
    site: true
    manifests: { publish: true, consume: true }
    # Where the content tree mounts inside the package, and which note is a
    # section's landing page. Read by both `manifest` and the knowledgebase
    # build, so the address a manifest publishes is the address a page is
    # emitted at — stating it twice is how a manifest comes to assert a URL
    # that resolves at build time and 404s for the reader.
    address:
        prefix: kb/
        landing: readme

# How this repository frames the website it publishes. Framing only — how a page
# gets its *address* is `publish.address` above, shared with the link manifest
# so the two cannot disagree about where a page is.
site:
    out: kb/content
    # Both packages are rendered here: this repository publishes the `sohl`
    # knowledgebase, and a `thalorna` note filed in this tree renders beside it.
    packages: [sohl, thalorna]
    backfillSections: true
    landing: { title: Knowledgebase, type: knowledgebase }
    # This repository's own body rewrites: `{@link}` against the TypeDoc symbol
    # map, and repo-relative links in the developer docs. Named rather than
    # imported — a configuration is data and cannot hold a function.
    pass: sohlKb
    passOptions:
        apiBase: /sohl/api/
        symbolMap: kb/data/api-symbols.json
        blob: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/blob/main/
    trees:
        - { from: kb/dev-docs, section: dev-docs }
    # Landing title + hero for each item section, so a landing matches the
    # home-page card that links to it rather than Hugo's auto-humanised
    # directory name. Actor subtypes are listed so their landing exists, titled,
    # before any content of that type ships.
    sections:
        being: { title: Beings, banner: banners/creature.webp }
        weapongear: { title: Weapons, banner: banners/weapons.webp }
        armorgear:
            { title: Armor/Clothing, banner: banners/armor-clothing.webp }
        projectilegear: { title: Projectiles, banner: banners/projectiles.webp }
        containergear: { title: Containers, banner: banners/containers.webp }
        miscgear: { title: Misc Gear, banner: banners/misc-gear.webp }
        affliction: { title: Afflictions, banner: banners/affliction.webp }
        trauma: { title: Trauma, banner: banners/trauma.webp }
        mysticalability:
            {
                title: Mystical Abilities,
                banner: banners/mystical-abilities.webp,
            }
        skill:
            { title: Skills/Attributes, banner: banners/skills-attributes.webp }
        attribute:
            { title: Skills/Attributes, banner: banners/skills-attributes.webp }
        # Map notes. No banner: the heroes are CDN assets and there is none for
        # maps yet, so these landings render without one.
        battlemap: { title: Battlemaps }
        localmap: { title: Local Maps }
        regionalmap: { title: Regional Maps }
    # Landing title + hero for the doc sections, whose index comes from a README.
    readmeSections:
        dev-docs:
            { title: Developer Documentation, banner: banners/dev-docs.webp }
        user-guide: { title: User Guide, banner: banners/user-guide.webp }
        rules: { title: Rules, banner: banners/rules.webp }
        credits: { title: Credits & Attributions }
