contentPackage: sohl

packageKind: systems

stats:
    lastModifiedBy: sohlbuilder00000

compatibility:
    minimum: "14.359"
    verified: "14.364"

docs:
    itemFields:
        title: Item Note Frontmatter
        out: assets/content/Dev_Docs/content-creator/item-frontmatter.md
        # `kbcat: devdocs` places this page in the developer-docs index.
        frontmatter:
            description: "The generated per-type field reference for all 13 item types: every `sohl:` field, its shape, requiredness, and default."
            sohl:
                kbcat: devdocs
        preamble:
            - "See also: [[doc-authoringworkflow|The Authoring Workflow]], [[doc-actornotes|Actor Notes]], [[doc-assetconventions|Asset Conventions]]"
            - ""
            - "Every item note carries the frontmatter envelope described in [[doc-authoringworkflow|The Authoring Workflow]] — `name.full`, `type`, `shortcode`, and the required `sohl.archetype`. This page covers what each **type** adds to that: the fields under its `sohl:` block, and nothing else."
            - ""
            - "The tables are rendered from the declaration that _builds_ each document, not from a description of it, so a field listed here is a field the compiler reads and a field absent here is one it ignores. An unrecognised `sohl:` key is silently dropped, so a typo shows up as a missing value rather than an error — check the spelling here first."

# Names this repository's own item-type registry — SoHL data-model knowledge,
# not shared with `hm3`.
itemBuilders: sohl

# `assets/content/` is opened as an Obsidian vault; Templater's `Templates/`
# scaffolding is never compendium content.
skipDirectories: [Templates]

# Generated by `utils/build-icon-legend.mjs` from the classes the interface
# actually renders, so the registry, the icon legend and the webfont cannot
# disagree.
icons: assets/icon-registry.yaml

packs:
    - { name: items, label: Items, type: Item }
    - { name: journals, label: Journals, type: JournalEntry }
    - { name: actors, label: Actors, type: Actor }
    - { name: macros, label: Macros, type: Macro }
    - name: scenes
      type: Scene
      label: Maps
      # One pass, two packs: every map note's Scene, and the Adventure bundling
      # the pinned ones with their journals, so a `keepId: true` import
      # resolves the pins.
      companions:
          - { name: adventures, type: Adventure, label: Adventures }

packageBuild:
    # Both registries live in one configuration module here, so the file is
    # named twice; a system that keeps one registry per file names two.
    schema:
        Item: { from: src/core/foundry/sohl-config.ts, registry: ITEM_DM_DEF }
        Actor: { from: src/core/foundry/sohl-config.ts, registry: ACTOR_DM_DEF }

    assets:
        - { from: assets/audio, to: assets/audio }
        - { from: assets/icons, to: assets/icons }
        - { from: assets/images, to: assets/images }
        - { from: assets/fonts, to: assets/fonts }
        - { from: assets/ui, to: assets/ui }
        - { from: lang, to: lang }
        - { from: templates, to: templates }
        - { from: LICENSE.md, to: LICENSE.md }
        - { from: README.md, to: README.md }
        # Shipped inside the archive rather than left to be fetched from a git
        # tag, because `content-build deps fetch` already downloads and unzips
        # exactly this archive at a relationship's `compatibility.verified` —
        # so a consumer reads the schema of the version it actually pins,
        # through the cache it already has, with no second network path and no
        # way for the two to disagree.
        - { from: build/schema.json, to: schema.json }

    assetTransform: svg-theme

    lang:
        sources: lang/*.json
        help: >-
            A dotted-prefix collision makes foundry.utils.expandObject throw, and
            Foundry then drops the whole translation file (issue #636). Make each
            key a leaf OR a branch, never both. See
            assets/content/Dev_Docs/reference/localization-keys.md for the
            placeholder and key-segment rules.

        # `TYPE` is stated because `lang/en.json` declares no key under it yet,
        # though the code scans for it; left to derive from the file's own
        # keys, that root would silently stop being checked.
        keyRoots: [SOHL, TYPES, TYPE]

        # `defineType(prefix, def, labelKeys?)` (`src/utils/constants.ts`) mints
        # one key per member of an enum by a rule that is SoHL's alone, so no
        # shared guard can know it. This module reproduces the rule from the
        # TypeScript AST and hands the keys back as an ordinary reference set.
        references: ./utils/lang-references.mjs

        retained:
            - prefix: SOHL.Gear.Action.
              reason: Intrinsic action titles built as `${titlePrefix}.${shortcode}`
                  — the prefix is a parameter, so no scan can resolve it.
            - prefix: SOHL.Skill.Action.
              reason: As above (defineImproveSdrActions is called with the kind's
                  prefix).
            - prefix: SOHL.MysticalAbility.Action.
              reason: As above.
            - prefix: SOHL.Affliction.Action.
              reason: As above.
            - prefix: SOHL.Being.StumbleTest.
              reason: keepControlTable resolves `<prefix>.<SuccessLevel>.label|description`
                  from a success level computed at runtime.
            - prefix: SOHL.Being.FumbleTest.
              reason: As above.
            - prefix: SOHL.AttackResult.TacticalAdvantage.action
              reason: Resolved from the stored tactical-advantage value, not named
                  in source.

        allow:
            - literal: item.system.code === 'pyrn'
              reason: A SafeExpression example shown as a placeholder — code, not
                  prose.

    # Vite emits `sohl.js`, not the `<packageId>.mjs` the toolchain assumes, so
    # the one thing `package-build bundle check` cannot derive is stated here.
    bundle:
        entry: sohl.js

    # `leg` deploys the non-TypeScript build to an older Foundry version, kept
    # running by hand for players who have not moved off it — an empty `world`
    # declares "never auto-launch". Its Foundry version comes from
    # FOUNDRYVTT_LEG_VERSION in .env.local, the maintainer's own.
    container:
        stages:
            leg: { port: 30000, world: "" }

    # Everything about the disposable world derives from the package id —
    # world `sohl-e2e`, GM `Gamemaster` / `sohl-e2e` — so none of it is stated
    # here. The Foundry build the suite runs on is not stated either: it is
    # `compatibility.minimum` above, so the claim and the evidence for it are
    # one number, and raising the pin is a decision to raise the supported
    # floor rather than a test tweak.
    e2e:
        suite:
            run: [npx, cypress, run]
            open: [npx, cypress, open]

        # What the fast loop can rebuild, in the order it must be built: vite
        # empties `build/stage`, so `code` goes first and the asset and pack
        # passes copy into a stage it has already cleared. `system` writes the
        # manifest, which Foundry reads once at world launch — so producing it
        # means the container is recreated, not merely restarted.
        build:
            code: build:code
            css: build:css
            assets: build:assets
            db: build:db
            system: { script: build:system, recreate: true }

    # `flags.sohl.creditsUuid` is not a literal: it is the compendium address of
    # the credits journal, which only exists once the content tree has been
    # walked. This module computes it.
    manifestFlags: ./utils/manifest-flags.mjs

    manifest:
        title: Song of Heroic Lands
        descriptionHtml:
            "<p><strong>Song of Heroic Lands: A Gateway to Adventure!</strong> Embark on a journey
            through a richly detailed fantasy world with Song of Heroic Lands (SoHL)—a game system built to
            bring your adventures to life in Foundry Virtual Tabletop. Seamlessly compatible with the renowned
            HârnMaster system, SoHL allows you to experience the intricacies of one of the most immersive
            and realistic fantasy role-playing systems ever created.</p><p>Designed for both seasoned veterans
            and new players, SoHL captures the essence of detailed game mechanics while leveraging the power
            of Foundry VTT to streamline gameplay, enhance storytelling, and immerse you in the lore-rich
            environment.</p>"
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE.md
        readme: README.md
        changelog: CHANGELOG.md
        flags:
            allowBugReporter: true
            needsMigrationVersion: 0.3.5
            compatibleMigrationVersion: 0.3.0
        esmodules:
            - sohl.js
        styles:
            - css/sohl.css
        languages:
            - lang: en
              name: English
              path: lang/en.json
        documentTypes:
            Actor:
                being:
                    htmlFields:
                        - dossier
                        - appearance
                cohort:
                    htmlFields:
                        - dossier
                        - appearance
                structure:
                    htmlFields:
                        - dossier
                        - appearance
                vehicle:
                    htmlFields:
                        - dossier
                        - appearance
            Item:
                affiliation:
                    htmlFields:
                        - notes
                        - docHtml
                affliction:
                    htmlFields:
                        - notes
                        - docHtml
                armorgear:
                    htmlFields:
                        - notes
                        - docHtml
                attribute:
                    htmlFields:
                        - notes
                        - docHtml
                concoctiongear:
                    htmlFields:
                        - notes
                        - docHtml
                containergear:
                    htmlFields:
                        - notes
                        - docHtml
                trauma:
                    htmlFields:
                        - notes
                        - docHtml
                miscgear:
                    htmlFields:
                        - notes
                        - docHtml
                mystery:
                    htmlFields:
                        - notes
                        - docHtml
                mysticalability:
                    htmlFields:
                        - notes
                        - docHtml
                projectilegear:
                    htmlFields:
                        - notes
                        - docHtml
                skill:
                    htmlFields:
                        - notes
                        - docHtml
                weapongear:
                    htmlFields:
                        - notes
                        - docHtml
            ActiveEffect:
                sohleffectdata: {}
            RegionBehavior:
                trigger: {}
        packFolders:
            - name: Song of Heroic Lands
              sorting: m
              color: "#094fcb"
              packs:
                  - items
                  - journals
                  - actors
                  - macros
                  - scenes
                  - adventures
        media:
            - type: setup
              url: systems/sohl/assets/ui/sohl-icon-3d-1920x1080.webp
              thumbnail: systems/sohl/assets/ui/sohl-icon-3d-400x225.webp
            - type: logo
              url: systems/sohl/assets/ui/sohl-icon-3d-400x100.webp
            - type: icon
              url: systems/sohl/assets/ui/sohl-icon-3d-512x512.webp
            - type: banner
              url: systems/sohl/assets/ui/sohl-icon-3d-1200x400.webp
        socket: true
        grid:
            distance: 5
            units: ft
        primaryTokenAttribute: health

publish:
    # This repository publishes the whole knowledgebase, so it is `content`:
    # the front page plus every page the content tree compiles to.
    site: content
    address:
        prefix: kb/

site:
    assets: https://cdn.heroiclands.org
    description: Song of Heroic Lands — a classless, skill-based fantasy system for Foundry Virtual Tabletop.
    # This repository's own body rewrite: `{@link}` against the TypeDoc symbol
    # map, which the TypeDoc build writes to `build/hugo/data/` (`docs:html`
    # runs before the site build).
    pass: sohlKb
    passOptions:
        apiBase: /sohl/api/
        symbolMap: build/hugo/data/api-symbols.json
    # One page covers the whole of /sohl/, so it names every surface — a reader
    # who mistyped an API address is served the same file as one who mistyped a
    # page address. Each `url` is written site-relative and picks up the
    # /sohl/ prefix.
    notfound:
        heroimage: images/brand/sohl-banner.webp
        tagline: Song of Heroic Lands has no page at
        sitenoun: site
        links:
            - title: Song of Heroic Lands
              url: /
              text: What the system is, and where everything about it lives.
            - title: API Documentation
              url: /api/
              text: Generated reference for the current release.
            - title: Developer Documentation
              url: /doc-devdocs/
              text: Architecture, extension points, testing, and reference material.
            - title: User Guide
              url: /doc-userguide/
              text: Player- and GM-facing guides to playing with Song of Heroic Lands.
            - title: Rules
              url: /doc-rulesintro/
              text: Success and opposed tests, injury, healing, shock, bleeding, and trauma.
    # The highlight style is the one the developer documentation's code blocks
    # are styled for.
    hugo:
        markup:
            highlight:
                style: monokai
