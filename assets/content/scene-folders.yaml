# Folder hierarchy for the "scenes" compendium.
#
# Each entry declares one folder:
#   name            (required) display name
#   id              (required) stable 16-char Foundry ID
#   parentFolderId  (required) id of the parent folder, or "" for top-level
#   color           (optional) folder color (CSS hex)
#
# Sibling folders (same parentFolderId) must have unique names.
#
# Map notes link to folders via `sohl.folder: <id>` in frontmatter, where <id>
# is the target folder's id from this file. Unknown ids fail the compile loudly.
#
# Colors are chosen for legibility with white folder-label text (>= 4.5:1
# against white) and to stay mutually distinct in perceptual (OKLab) terms.

- name: Battlemaps
  id: Pw3nJvVsGuMdRb1K
  parentFolderId: ""
  color: "#3f5f7a"

- name: Local Maps
  id: XmT4qKdYrAoZ7NcE
  parentFolderId: ""
  color: "#5c6b3d"

- name: Regional Maps
  id: Vh8pLwCzEnUyQ2Sd
  parentFolderId: ""
  color: "#7a4a3f"
